<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheep Herder Chase Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:#2e7d32;color:white;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
h1{margin:0 0 8px;font-size:clamp(22px,4vw,32px)}#game-info{font-size:18px;font-weight:bold;margin-bottom:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.game-wrap{position:relative;width:min(600px,95vw)}canvas{display:block;width:100%;height:auto;background:#81c784;border:4px solid #1b5e20;border-radius:8px;touch-action:none}
#overlay{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center;background:#123b20df;border-radius:5px}#overlay.hidden{display:none}
#message{font-size:clamp(20px,4vw,30px);font-weight:800}#detail{max-width:360px;line-height:1.5}
button{border:0;border-radius:8px;padding:12px 20px;font:inherit;font-weight:800;background:#fff176;color:#173d1c;cursor:pointer}button:hover{background:#fff59d}
.instructions{max-width:600px;text-align:center;line-height:1.5;font-size:14px}@media(max-height:600px){body{padding:8px}h1{font-size:22px;margin-bottom:4px}.instructions{font-size:12px}}
</style>
</head>
<body>
<h1>🐶 Sheep Herder Chase 🐑</h1>
<div id="game-info"><span>Score: <span id="score">0</span></span><span>Sheep remaining: <span id="remaining">5</span></span></div>
<div class="game-wrap">
<canvas id="gameCanvas" width="600" height="400" aria-label="Sheep herding game"></canvas>
<div id="overlay"><div id="message">Ready to herd?</div><div id="detail">Collect all five sheep and avoid the wolf.</div><button id="restartButton" type="button">Start Game</button></div>
</div>
<p class="instructions">Move with <strong>Arrow Keys</strong> or <strong>W A S D</strong>. Collect every 🐑 and avoid the 🐺. Press <strong>Enter</strong> to restart after a round.</p>
<script>
(() => {
  const canvas=document.getElementById("gameCanvas"), ctx=canvas.getContext("2d");
  const scoreEl=document.getElementById("score"), remainingEl=document.getElementById("remaining");
  const overlay=document.getElementById("overlay"), messageEl=document.getElementById("message");
  const detailEl=document.getElementById("detail"), restartButton=document.getElementById("restartButton");
  const keys=Object.create(null), TOTAL_SHEEP=5;
  let score=0, state="ready", lastTime=0;
  const player={x:300,y:200,size:24,speed:220}, wolf={x:50,y:50,size:24,speed:200}, sheepList=[];

  function clearInputs(){ for(const key of Object.keys(keys)) keys[key]=false; }

  function spawnSheep(){
    sheepList.length=0;
    for(let i=0;i<TOTAL_SHEEP;i++){
      let x,y,attempts=0;
      do{x=25+Math.random()*(canvas.width-50);y=25+Math.random()*(canvas.height-50);attempts++;}
      while(attempts<100&&(Math.hypot(x-player.x,y-player.y)<75||Math.hypot(x-wolf.x,y-wolf.y)<65));
      const angle=Math.random()*Math.PI*2,speed=25+Math.random()*25;
      sheepList.push({x,y,size:20,dx:Math.cos(angle)*speed,dy:Math.sin(angle)*speed});
    }
    remainingEl.textContent=sheepList.length;
  }
  function showOverlay(title,detail,buttonText){
    messageEl.textContent=title;detailEl.textContent=detail;restartButton.textContent=buttonText;overlay.classList.remove("hidden");
  }
  function resetGame(startImmediately=true){
    // Clear all held keys before starting a fresh game.
    clearInputs();
    score=0;scoreEl.textContent="0";
    player.x=canvas.width/2;player.y=canvas.height/2;wolf.x=50;wolf.y=50;
    spawnSheep();
    state=startImmediately?"playing":"ready";
    if(startImmediately) overlay.classList.add("hidden");
    else showOverlay("Ready to herd?","Collect all five sheep and avoid the wolf.","Start Game");
    draw();
  }
  function endGame(result){
    if(state!=="playing")return;
    state=result;clearInputs();
    if(result==="won")showOverlay("🎉 You caught every sheep!",`You scored ${score} points. Great herding!`,"Play Again");
    else showOverlay("🐺 The wolf caught you!",`Final score: ${score}. Give it another try!`,"Try Again");
  }
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function update(dt){
    if(state!=="playing")return;
    let mx=0,my=0;
    if(keys.ArrowUp||keys.w)my--;if(keys.ArrowDown||keys.s)my++;
    if(keys.ArrowLeft||keys.a)mx--;if(keys.ArrowRight||keys.d)mx++;
    const length=Math.hypot(mx,my);
    if(length){mx/=length;my/=length;}
    player.x=clamp(player.x+mx*player.speed*dt,player.size,canvas.width-player.size);
    player.y=clamp(player.y+my*player.speed*dt,player.size,canvas.height-player.size);

    const angle=Math.atan2(player.y-wolf.y,player.x-wolf.x);
    wolf.x+=Math.cos(angle)*wolf.speed*dt;wolf.y+=Math.sin(angle)*wolf.speed*dt;
    if(Math.hypot(player.x-wolf.x,player.y-wolf.y)<player.size+wolf.size*.55){endGame("lost");return;}

    for(let i=sheepList.length-1;i>=0;i--){
      const s=sheepList[i];s.x+=s.dx*dt;s.y+=s.dy*dt;
      if(s.x<s.size||s.x>canvas.width-s.size){s.dx*=-1;s.x=clamp(s.x,s.size,canvas.width-s.size);}
      if(s.y<s.size||s.y>canvas.height-s.size){s.dy*=-1;s.y=clamp(s.y,s.size,canvas.height-s.size);}
      if(Math.hypot(player.x-s.x,player.y-s.y)<player.size*.65+s.size*.65){
        sheepList.splice(i,1);score+=100;scoreEl.textContent=score;remainingEl.textContent=sheepList.length;
      }
    }
    if(sheepList.length===0)endGame("won");
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#81c784";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#66bb6a";ctx.lineWidth=1;
    for(let y=20;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
    ctx.fillStyle="#388e3c";
    for(let i=0;i<55;i++){const x=(i*97+31)%canvas.width,y=(i*53+17)%canvas.height;ctx.fillRect(x,y,2,4);}
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="24px serif";
    for(const s of sheepList)ctx.fillText("🐑",s.x,s.y);
    ctx.font="28px serif";ctx.fillText("🐺",wolf.x,wolf.y);ctx.fillText("🐶",player.x,player.y);
  }
  function loop(timestamp){
    const dt=lastTime?Math.min((timestamp-lastTime)/1000,.05):0;lastTime=timestamp;
    update(dt);draw();requestAnimationFrame(loop);
  }
  window.addEventListener("keydown",e=>{
    const key=e.key.length===1?e.key.toLowerCase():e.key;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(key))e.preventDefault();
    keys[key]=true;
    if(key==="Enter"&&state!=="playing")resetGame(true);
  });
  window.addEventListener("keyup",e=>{
    const key=e.key.length===1?e.key.toLowerCase():e.key;keys[key]=false;
  });
  window.addEventListener("blur",clearInputs);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)clearInputs();});
  restartButton.addEventListener("click",()=>resetGame(true));
  resetGame(false);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
