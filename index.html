<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheep Herder Chase Game</title>
  <style>
    body {
      margin: 0;
      background-color: #2e7d32;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-info {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    canvas {
      background-color: #81c784;
      border: 4px solid #1b5e20;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="game-info">
    Score: <span id="score">0</span> | Remaining: <span id="remaining">5</span>
  </div>
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const remainingEl = document.getElementById("remaining");

    let score = 0;
    const keys = {};

    // Player (Dog)
    const player = { x: 300, y: 200, size: 24, speed: 4 };

    // Sheep array
    const sheepList = [];
    const totalSheep = 5;

    // Enemy (Wolf)
    const wolf = { x: 50, y: 50, size: 24, speed: 3.9 };

    function spawnSheep() {
      for (let i = 0; i < totalSheep; i++) {
        sheepList.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: Math.random() * (canvas.height - 40) + 20,
          size: 20,
          dx: (Math.random() - 0.5) * 2,
          dy: (Math.random() - 0.5) * 2
        });
      }
    }

    window.addEventListener("keydown", (e) => keys[e.key] = true);
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function update() {
      // Player Movement
      if (keys["ArrowUp"] && player.y > player.size) player.y -= player.speed;
      if (keys["ArrowDown"] && player.y < canvas.height - player.size) player.y += player.speed;
      if (keys["ArrowLeft"] && player.x > player.size) player.x -= player.speed;
      if (keys["ArrowRight"] && player.x < canvas.width - player.size) player.x += player.speed;

      // Wolf chases player slowly
      const angle = Math.atan2(player.y - wolf.y, player.x - wolf.x);
      wolf.x += Math.cos(angle) * wolf.speed;
      wolf.y += Math.sin(angle) * wolf.speed;

      // Check Wolf Collision
      const wolfDist = Math.hypot(player.x - wolf.x, player.y - wolf.y);
      if (wolfDist < player.size) {
        alert("Game Over! The wolf caught you.");
        resetGame();
        return;
      }

      // Update Sheep and Catch Check
      for (let i = sheepList.length - 1; i >= 0; i--) {
        let s = sheepList[i];
        
        // Random wandering movement
        s.x += s.dx;
        s.y += s.dy;

        // Bounce off walls
        if (s.x < 10 || s.x > canvas.width - 10) s.dx *= -1;
        if (s.y < 10 || s.y > canvas.height - 10) s.dy *= -1;

        // Check if player catches sheep
        const dist = Math.hypot(player.x - s.x, player.y - s.y);
        if (dist < player.size + s.size) {
          sheepList.splice(i, 1);
          score += 100;
          scoreEl.textContent = score;
          remainingEl.textContent = sheepList.length;
        }
      }

      if (sheepList.length === 0) {
        alert("You caught all the sheep! You Win!");
        resetGame();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Player
      ctx.font = "24px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐶", player.x, player.y);

      // Draw Wolf
      ctx.fillText("🐺", wolf.x, wolf.y);

      // Draw Sheep
      sheepList.forEach(s => {
        ctx.fillText("🐑", s.x, s.y);
      });
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = score;
      player.x = 300;
      player.y = 200;
      wolf.x = 50;
      wolf.y = 50;
      sheepList.length = 0;
      spawnSheep();
      remainingEl.textContent = sheepList.length;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    spawnSheep();
    gameLoop();
  </script>
</body>
</html>
